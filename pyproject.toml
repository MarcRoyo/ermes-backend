[tool.poetry]
name = "ermes-backend"
version = "0.1.0"
description = "Public backend and API gateway for Ermes"
authors = ["Marc Royo"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = ">=0.134,<1"
httpx = ">=0.27,<1"
uvicorn = { version = ">=0.30,<1", extras = ["standard"] }
websockets = ">=17.4,<18"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.8,<1"
pytest = ">=8,<9"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
